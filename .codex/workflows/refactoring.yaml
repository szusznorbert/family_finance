id: refactoring
version: 1
steps:
  - id: planning
    agent: product_owner
    depends_on: []
    evidence: planning_artifact
  - id: baseline
    agent: architect
    depends_on: [planning]
    evidence: report
  - id: implementation
    agent: developer
    depends_on: [baseline]
    evidence: report
  - id: verification
    agent: tester
    depends_on: [implementation]
    evidence: command_gates
    commands:
      - [pnpm, lint]
      - [pnpm, typecheck]
      - [pnpm, build]
  - id: review
    agent: reviewer
    depends_on: [verification]
    evidence: passing_review
